<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="../assets/images/favicon.png">
<title>首页 · HopingStar</title>
<style>
  :root {
    --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --accent: #7c5cff; --accent2: #00d4ff;
    --card: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.12);
    --text: #f0f0ff; --muted: #aab2e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text);
    padding: 20px;
  }
  .nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
  .nav a {
    color: var(--text); text-decoration: none;
    padding: 9px 22px; border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(8px); font-size: 14px; transition: .2s;
  }
  .nav a:hover, .nav a.active { background: var(--accent); border-color: transparent; }

  .hero { text-align: center; padding: 30px 0 10px; }
  .hero .avatar {
    width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 20px;
    display: block; object-fit: cover;
    border: 2px solid rgba(255,255,255,.35);
    box-shadow: 0 8px 30px rgba(124,92,255,.4);
  }
  .hero h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); margin-bottom: 10px; }
  .hero p { color: var(--muted); font-size: 15px; max-width: 600px; margin: 0 auto 8px; line-height: 1.8; }

  .wrap { max-width: 1000px; margin: 30px auto 0; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 26px; backdrop-filter: blur(10px);
  }
  .card h2 { font-size: 20px; margin-bottom: 16px; color: #ffd740; }
  .card p, .card li { color: var(--muted); font-size: 14px; line-height: 1.9; }
  .card ul { padding-left: 20px; }

  .mods-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 12px; }
  .mod-card {
    background: rgba(0,0,0,.25); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; display: flex; gap: 14px; align-items: center; transition: .2s;
  }
  .mod-card:hover { transform: translateY(-3px); border-color: var(--accent2); }
  .mod-card img { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; }
  .mod-card h3 { font-size: 16px; margin-bottom: 4px; }
  .mod-card a { text-decoration: none; color: var(--text); }

  .more { text-align: center; margin: 24px 0; }
  .more a { color: var(--accent2); text-decoration: none; font-size: 14px; }
  .more a:hover { text-decoration: underline; }

  .footer { text-align: center; margin-top: 46px; color: #8a93c8; font-size: 13px; }
</style>
</head>
<body>
  <div class="nav">
    <a href="./" class="active">🏠 首页</a>
    <a href="../mods/">🧩 我的模组</a>
    <a href="../about/">ℹ️ 关于我</a>
  </div>

  <div class="hero">
    <img class="avatar" src="../assets/images/head_image.jpg" alt="HopingStar">
    <h1>你好，我是 HopingStar</h1>
    <p>Minecraft 模组开发者 / 整合包维护者</p>
    <p>喜欢折腾 Mod、做兼容补丁、分享好玩的整合包。这里记录我的作品与日常。</p>
  </div>

  <div class="wrap">
    <div class="card">
      <h2>🚀 最新作品</h2>
      <div class="mods-grid">
        <div class="mod-card">
          <a href="../mod-info/l2trav-patch/">
            <img src="../assets/images/l2trav_patch.png" alt="L2 & Trav Patch">
          </a>
          <div>
            <h3><a href="../mod-info/l2trav-patch/">L2 &amp; Trav Patch</a></h3>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;"><span style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#ff7a2f;"><img src="../assets/icons/neoforge.png" alt="NeoForge" style="width:15px;height:15px;display:block;border-radius:3px;">NeoForge</span></div>
          </div>
        </div>
        <div class="mod-card">
          <a href="../mod-info/some-special-music-discs/">
            <img src="../assets/images/some_special_music_discs.png" alt="Some Special Music Discs">
          </a>
          <div>
            <h3><a href="../mod-info/some-special-music-discs/">Some Special Music Discs</a></h3>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;"><span style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#7b8fe8;"><img src="../assets/icons/fabric.png" alt="Fabric" style="width:15px;height:15px;display:block;border-radius:3px;">Fabric</span><span style="display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#ff7a2f;"><img src="../assets/icons/neoforge.png" alt="NeoForge" style="width:15px;height:15px;display:block;border-radius:3px;">NeoForge</span></div>
          </div>
        </div>
      </div>
      <div class="more"><a href="../mods/">查看全部模组 →</a></div>
    </div>

    <div class="card" style="margin-top:24px">
      <h2>🎯 我正在做什么</h2>
      <ul>
        <li>维护整合包，解决模组间兼容问题，制作小型模组</li>
        <li>开发轻量级运行时补丁（Mixin 技术）</li>
        <li>探索好玩的 Minecraft 模组组合</li>
      </ul>
    </div>
  </div>

  <div class="footer">© <span id="yr"></span> HopingStar · <a href="../about/" style="color:#90caf9;text-decoration:none">关于我</a></div>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
