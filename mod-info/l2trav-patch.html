<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2 & Trav Patch · 详情</title>
<link rel="icon" type="image/png" href="../favicon.png">
<style>
  :root {
    --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --accent: #7c5cff; --accent2: #00d4ff;
    --card: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.12);
    --text: #f0f0ff; --muted: #aab2e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text); padding: 20px;
  }
  .nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; }
  .nav a {
    color: var(--text); text-decoration: none; padding: 9px 22px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,.05);
    backdrop-filter: blur(8px); font-size: 14px; transition: .2s;
  }
  .nav a:hover, .nav a.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 18px;
    padding: 34px; max-width: 640px; margin: 0 auto; backdrop-filter: blur(10px);
  }
  .head { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
  .head img { width: 72px; height: 72px; border-radius: 14px; }
  .head h1 { font-size: 24px; }
  .head .v { color: #ffd740; font-size: 14px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }

  .dl-box { background: rgba(0,0,0,.25); border-radius: 14px; padding: 20px; }
  .dl-box h2 { font-size: 16px; color: #ffd740; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; outline: none;
  }
  .field select:focus { border-color: var(--accent2); }
  .btn {
    display: block; width: 100%; text-align: center; margin-top: 18px;
    padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; text-decoration: none; transition: .2s; border: none; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }

  .section { background: rgba(0,0,0,.25); border-radius: 14px; padding: 16px 20px; margin-top: 20px; }
  .section h2 { font-size: 16px; color: #ffd740; margin-bottom: 8px; }
  .section ul { padding-left: 20px; color: var(--muted); font-size: 14px; line-height: 1.9; }
  .back { text-align: center; margin-top: 18px; }
  .back a { color: var(--accent2); text-decoration: none; font-size: 14px; }
  .back a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="nav">
    <a href="../home.html">🏠 首页</a>
    <a href="../mods.html">🧩 我的模组</a>
    <a href="../about.html">ℹ️ 关于我</a>
  </div>

  <div class="card">
    <div class="head">
      <img src="../l2trav_patch.png" alt="L2 & Trav Patch">
      <div>
        <h1>L2 &amp; Trav Patch</h1>
        <div class="v">运行时兼容补丁</div>
      </div>
    </div>
    <p class="desc">修复整合包中 <b>l2weaponry</b> 与 <b>traveloptics</b> 的崩溃冲突，让它们能共存。放入 mods 文件夹即生效，无需额外配置。</p>

    <div class="dl-box" id="download">
      <h2>⬇ 选择版本下载</h2>
      <div class="field">
        <label>Minecraft 版本</label>
        <select id="mc"></select>
      </div>
      <div class="field">
        <label>模组版本</label>
        <select id="mv"></select>
      </div>
      <div class="field">
        <label>模组加载器</label>
        <select id="ld"></select>
      </div>
      <a class="btn" id="dlBtn" href="#" download>下载</a>
    </div>

    <div class="section">
      <h2>ℹ️ 说明</h2>
      <ul>
        <li>适用于 Minecraft 1.21.1 · NeoForge</li>
        <li>运行时自动修复，不修改其它模组文件</li>
        <li>需要同时安装 l2weaponry 与 traveloptics</li>
      </ul>
    </div>

    <div class="back"><a href="../mods.html">← 返回模组列表</a></div>
  </div>

  <script>
    // 可用版本清单（MC版本 | 模组版本 | 加载器 -> jar 相对路径）
    var files = {
      "1.21.1|1.0.2|NeoForge": "../mods/l2trav_patch-1.0.2.jar"
    };
    var mcs = ["1.21.1"];
    var mvs = ["1.0.2"];
    var lds = ["NeoForge"];

    function fill(sel, arr) { sel.innerHTML = ""; arr.forEach(function(v){ var o=document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o); }); }
    fill(document.getElementById("mc"), mcs);
    fill(document.getElementById("mv"), mvs);
    fill(document.getElementById("ld"), lds);

    function update() {
      var key = document.getElementById("mc").value + "|" + document.getElementById("mv").value + "|" + document.getElementById("ld").value;
      var href = files[key] || "#";
      document.getElementById("dlBtn").href = href;
      document.getElementById("dlBtn").setAttribute("download", href.split("/").pop());
    }
    ["mc","mv","ld"].forEach(function(id){ document.getElementById(id).addEventListener("change", update); });
    update();
  </script>
</body>
</html>
