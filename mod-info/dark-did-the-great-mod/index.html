<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Dart Did The Great Mod · 详情</title>
<link rel="icon" type="image/png" href="../../assets/images/favicon.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Segoe UI","PingFang SC",sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#f0f0ff;min-height:100vh;padding:20px;}
  .nav{text-align:center;margin-bottom:30px;}
  .nav a{color:#f0f0ff;text-decoration:none;padding:9px 20px;border:1px solid rgba(255,255,255,.15);border-radius:999px;margin:0 6px;font-size:14px;}
  .nav a:hover{background:#7c5cff;border-color:transparent;}
  .card{position:relative;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:32px;max-width:640px;margin:0 auto;}
  .card-badges{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:2;}
  .card-badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;letter-spacing:1px;color:#fff;background:#ff7a2f;}
  .head{display:flex;gap:16px;align-items:center;margin-bottom:16px;}
  .head img{width:64px;height:64px;border-radius:12px;}
  .head h1{font-size:24px;}
  .v{color:#ffd740;font-weight:600;}
  .desc{color:#aab2e6;line-height:1.8;margin-bottom:20px;}
  .dl-box{background:rgba(0,0,0,.25);border-radius:14px;padding:18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:#aab2e6;margin-bottom:5px;}
  .cs{position:relative;}
  .cs-head{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px;}
  .cs-head::after{content:" \25BE";color:#aab2e6;}
  .cs-list{position:absolute;top:calc(100%+4px);left:0;right:0;z-index:200;background:#1c1b3a;border:1px solid rgba(255,255,255,.15);border-radius:10px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .cs.open .cs-list{display:block;}
  .cs-opt{padding:10px 12px;cursor:pointer;font-size:14px;}
  .cs-opt:hover{background:rgba(124,92,255,.35);}
  .btn{display:block;width:100%;text-align:center;margin-top:16px;padding:13px;border-radius:12px;font-weight:700;background:linear-gradient(90deg,#7c5cff,#00d4ff);color:#fff;text-decoration:none;}
  .btn.disabled{opacity:.5;pointer-events:none;}
  .section{background:rgba(0,0,0,.25);border-radius:12px;padding:14px 18px;margin-top:16px;}
  .section h2{font-size:15px;color:#ffd740;margin-bottom:6px;}
  .section p{color:#aab2e6;font-size:14px;line-height:1.8;}
  .other-dl{display:flex;flex-direction:column;gap:8px;}
  .other-dl a{display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:10px;background:rgba(124,92,255,.12);border:1px solid rgba(124,92,255,.35);color:#c8c8ff;text-decoration:none;font-size:14px;transition:.2s;}
  .other-dl a:hover{background:rgba(124,92,255,.25);color:#fff;}
  .old-notice{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:min(480px,90vw);background:rgba(50,40,30,.95);border:1px solid rgba(255,122,47,.55);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.45);z-index:9999;overflow:hidden;animation:noticeIn .4s ease;}
  @keyframes noticeIn{from{opacity:0;transform:translate(-50%,-26px);}to{opacity:1;transform:translate(-50%,0);}}
  .old-notice.leaving{animation:noticeOut .4s ease forwards;}
  @keyframes noticeOut{from{opacity:1;transform:translate(-50%,0);}to{opacity:0;transform:translate(-50%,-32px);}}
  .old-notice-body{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;color:#ffd7b3;font-size:14px;font-weight:600;}
  .old-notice-close{background:none;border:none;color:#ff9d5c;font-size:15px;cursor:pointer;padding:2px 7px;border-radius:6px;line-height:1;}
  .old-notice-close:hover{background:rgba(255,122,47,.2);}
  .old-notice-bar{height:4px;background:rgba(255,255,255,.12);}
  .old-notice-fill{height:100%;width:0%;background:linear-gradient(90deg,#ff7a2f,#ffb380);animation:noticeBar 5s linear forwards;}
  @keyframes noticeBar{from{width:0%;}to{width:100%;}}
  .old-notice.dl-notice{border-color:rgba(0,212,255,.55);background:rgba(20,45,70,.95);}
  .old-notice.dl-notice .old-notice-body{color:#bfe9ff;}
  .old-notice.dl-notice .old-notice-close{color:#7adfff;}
  .old-notice.dl-notice .old-notice-fill{background:linear-gradient(90deg,#00d4ff,#7adfff);}
</style>
</head>
<body>
<div class="old-notice" id="oldNotice"><div class="old-notice-body"><span>⚠️ 你正在浏览旧模组的页面</span><button class="old-notice-close" onclick="closeOldNotice()">✕</button></div><div class="old-notice-bar"><div class="old-notice-fill"></div></div></div>
<div class="nav"><a href="../../home/">🏠 首页</a><a href="../../mods/">🧩 我的模组</a><a href="../../about/">ℹ️ 关于我</a></div>
<div class="card">
  <div class="card-badges"><span class="card-badge old">OLD</span></div>
  <div class="head"><img src="../../assets/images/logo_old_mod1.png" alt="Dart Did The Great Mod"><div><h1>Dart Did The Great Mod</h1></div></div>
  <p class="desc">这是一个旧模组，用于<span style="color:#AA00AA;font-weight:bold;">STARFALL</span>服务器（现已关停）</p>
  <div class="dl-box" id="download">
    <h2 style="font-size:16px;color:#ffd740;margin-bottom:14px">⬇ 选择版本下载</h2>
    <div class="field"><label>模组加载器</label><div class="cs" id="cs-ld"><div class="cs-head"></div><div class="cs-list"></div></div></div>
    <div class="field"><label>Minecraft 版本</label><div class="cs" id="cs-mc"><div class="cs-head"></div><div class="cs-list"></div></div></div>
    <div class="field"><label>模组版本</label><div class="cs" id="cs-mv"><div class="cs-head"></div><div class="cs-list"></div></div></div>
    <a class="btn" id="dlBtn" href="#" download>下载</a>
  </div>
  
  <div class="section"><h2>ℹ️ 可用版本</h2><p>Minecraft 1.20.1 · Forge</p></div>
  <div class="section"><h2>🖧关联模组</h2><p><span style="color:#FFAA00;">[可选] Alex&#x27;s Mobs<br></span><span style="color:#FFAA00;">[可选] Ars Nouveau</span></p></div>
  
</div>
<script>
var files={"1.20.1|1.0.6|Forge":"../../assets/files/dart_did_the_great_mod-forge-1.20.1-1.0.6.jar","1.20.1|1.0.6|Fabric":"../../assets/files/dart_did_the_great_mod-fabric-1.20.1-1.0.6.jar","1.21.1|1.0.6|NeoForge":"../../assets/files/dart_did_the_great_mod-neoforge-1.21.1-1.0.6.jar"};
function combos(){return Object.keys(files).map(function(k){var p=k.split('|');return {mc:p[0],mv:p[1],ld:p[2]};});}
function unique(a){return a.filter(function(v,i){return a.indexOf(v)===i;});}
function gv(id){return document.getElementById('cs-'+id).getAttribute('data-val');}
function sv(id,v){var cs=document.getElementById('cs-'+id);cs.setAttribute('data-val',v);cs.querySelector('.cs-head').textContent=v;}
function render(id,opts){var cs=document.getElementById('cs-'+id),list=cs.querySelector('.cs-list');list.innerHTML='';opts.forEach(function(v){var o=document.createElement('div');o.className='cs-opt';o.textContent=v;o.setAttribute('data-v',v);o.onclick=function(e){e.stopPropagation();cs.classList.remove('open');refresh(id,v);};list.appendChild(o);});}
document.querySelectorAll('.cs').forEach(function(cs){cs.querySelector('.cs-head').onclick=function(e){e.stopPropagation();var o=cs.classList.contains('open');document.querySelectorAll('.cs.open').forEach(function(x){x.classList.remove('open');});if(!o)cs.classList.add('open');};});
document.addEventListener('click',function(){document.querySelectorAll('.cs.open').forEach(function(x){x.classList.remove('open');});});
function refresh(fid,fv){
  if(fid==='ld')sv('ld',fv);
  else if(fid==='mc')sv('mc',fv);
  else if(fid==='mv')sv('mv',fv);
  var ldOpts=unique(combos().map(function(c){return c.ld;}));
  var mcOpts=unique(combos().filter(function(c){return c.ld===gv('ld');}).map(function(c){return c.mc;}));
  if(ldOpts.length&&ldOpts.indexOf(gv('ld'))<0)sv('ld',ldOpts[0]);
  if(mcOpts.length&&mcOpts.indexOf(gv('mc'))<0)sv('mc',mcOpts[0]);
  var mvOpts=unique(combos().filter(function(c){return c.ld===gv('ld')&&c.mc===gv('mc');}).map(function(c){return c.mv;}));
  if(mvOpts.length&&mvOpts.indexOf(gv('mv'))<0)sv('mv',mvOpts[0]);
  render('ld',ldOpts);render('mc',mcOpts);render('mv',mvOpts);
  var k=gv('mc')+'|'+gv('mv')+'|'+gv('ld'),h=files[k]||'#',b=document.getElementById('dlBtn');
  if(h==='#'){b.href='#';b.classList.add('disabled');b.textContent='此组合暂无可下载文件';}
  else{b.href=h;b.classList.remove('disabled');b.textContent='下载';b.setAttribute('download',h.split('/').pop());}
}
(function(){var c0=combos()[0];if(c0){sv('ld',c0.ld);sv('mc',c0.mc);sv('mv',c0.mv);}refresh();})();
document.getElementById('dlBtn').addEventListener('click',function(e){
  var h=this.getAttribute('href');
  if(!h||h==='#'||this.classList.contains('disabled')){e.preventDefault();return;}
  e.preventDefault();
  var a=document.createElement('a');
  a.href=h;
  a.download=this.getAttribute('download')||'';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showDlNotice();
});
function showDlNotice(){
  var old=document.getElementById('dlNotice');
  if(old&&old.parentNode)old.parentNode.removeChild(old);
  var n=document.createElement('div');n.id='dlNotice';n.className='old-notice dl-notice';
  n.innerHTML='<div class="old-notice-body"><span>📥 下载已开始</span><button class="old-notice-close" onclick="closeDlNotice()">✕</button></div><div class="old-notice-bar"><div class="old-notice-fill"></div></div>';
  document.body.appendChild(n);
  setTimeout(function(){closeDlNotice();},5000);
}
function closeDlNotice(){
  var el=document.getElementById('dlNotice');
  if(!el)return;
  el.classList.add('leaving');
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);
}
setTimeout(function(){closeOldNotice();},5000);function closeOldNotice(){var el=document.getElementById('oldNotice');if(!el)return;el.classList.add('leaving');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},400);}
</script>
</body>
</html>
