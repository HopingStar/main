<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L2 & Trav Patch · 详情</title>
<link rel="icon" type="image/png" href="../../favicon.png">
<style>
  :root {
    --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --accent: #7c5cff; --accent2: #00d4ff;
    --card: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.12);
    --text: #f0f0ff; --muted: #aab2e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text); padding: 20px;
  }
  .nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 36px; }
  .nav a {
    color: var(--text); text-decoration: none; padding: 9px 22px; border-radius: 999px;
    border: 1px solid var(--border); background: rgba(255,255,255,.05);
    backdrop-filter: blur(8px); font-size: 14px; transition: .2s;
  }
  .nav a:hover, .nav a.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; }

  .card {
    background: rgba(255,255,255,.12); border: 1px solid var(--border); border-radius: 18px;
    padding: 34px; max-width: 640px; margin: 0 auto;
  }
  .head { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
  .head img { width: 72px; height: 72px; border-radius: 14px; }
  .head h1 { font-size: 24px; }
  .head .v { color: #ffd740; font-size: 14px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 14px; line-height: 1.8; margin-bottom: 22px; }

  .dl-box { background: rgba(0,0,0,.25); border-radius: 14px; padding: 20px; }
  .dl-box h2 { font-size: 16px; color: #ffd740; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field select {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; outline: none;
  }
  .field select:focus { border-color: var(--accent2); }
  .btn {
    display: block; width: 100%; text-align: center; margin-top: 18px;
    padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff; text-decoration: none; transition: .2s; border: none; cursor: pointer;
  }
  .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
  .btn.disabled { opacity: .5; pointer-events: none; }

  .section { background: rgba(0,0,0,.25); border-radius: 14px; padding: 16px 20px; margin-top: 20px; }
  .section h2 { font-size: 16px; color: #ffd740; margin-bottom: 8px; }
  .section ul { padding-left: 20px; color: var(--muted); font-size: 14px; line-height: 1.9; }
  .back { text-align: center; margin-top: 18px; }
  .back a { color: var(--accent2); text-decoration: none; font-size: 14px; }
  .back a:hover { text-decoration: underline; }

  /* 自定义下拉菜单 */
  .cs { position: relative; }
  .cs-head {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: rgba(255,255,255,.08); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    user-select: none;
  }
  .cs-head:hover { border-color: var(--accent2); }
  .cs-head::after { content: "▾"; margin-left: 8px; color: var(--muted); }
  .cs-list {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 200;
    background: #1c1b3a; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .cs.open .cs-list { display: block; }
  .cs-opt { padding: 10px 12px; cursor: pointer; font-size: 14px; color: var(--text); }
  .cs-opt:hover { background: rgba(124,92,255,.35); }
</style>
</head>
<body>
  <div class="nav">
    <a href="../../home/">🏠 首页</a>
    <a href="../../mods/">🧩 我的模组</a>
    <a href="../../about/">ℹ️ 关于我</a>
  </div>

  <div class="card">
    <div class="head">
      <img src="../../l2trav_patch.png" alt="L2 & Trav Patch">
      <div>
        <h1>L2 &amp; Trav Patch</h1>
        <div class="v">运行时兼容补丁</div>
      </div>
    </div>
    <p class="desc">修复整合包中 <b>l2weaponry</b> 与 <b>traveloptics</b> 的崩溃冲突，让它们能共存。放入 mods 文件夹即生效，无需额外配置。</p>

    <div class="dl-box" id="download">
      <h2>⬇ 选择版本下载</h2>
      <div class="field">
        <label>Minecraft 版本</label>
        <div class="cs" id="cs-mc"><div class="cs-head"></div><div class="cs-list"></div></div>
      </div>
      <div class="field">
        <label>模组版本</label>
        <div class="cs" id="cs-mv"><div class="cs-head"></div><div class="cs-list"></div></div>
      </div>
      <div class="field">
        <label>模组加载器</label>
        <div class="cs" id="cs-ld"><div class="cs-head"></div><div class="cs-list"></div></div>
      </div>
      <a class="btn" id="dlBtn" href="#" download>下载</a>
    </div>

    <div class="section">
      <h2>ℹ️ 说明</h2>
      <ul>
        <li>适用于 Minecraft 1.21.1 · NeoForge</li>
        <li>运行时自动修复，不修改其它模组文件</li>
        <li>需要同时安装 l2weaponry 与 traveloptics</li>
      </ul>
    </div>

    <div class="back"><a href="../../mods/">← 返回模组列表</a></div>
  </div>

  <script>
    // 可用版本清单（MC版本 | 模组版本 | 加载器 -> jar 相对路径）
    var files = {
      "1.21.1|1.0.2|NeoForge": "../../mod-files/l2trav_patch-1.0.2.jar"
    };
    var allOpts = { mc: ["1.21.1"], mv: ["1.0.2"], ld: ["NeoForge"] };

    function getVal(id){ return document.getElementById('cs-' + id).getAttribute('data-val'); }
    function setVal(id, v){ var cs = document.getElementById('cs-' + id); cs.setAttribute('data-val', v); cs.querySelector('.cs-head').textContent = v; }

    // 在所有有效组合里，找匹配 forcedId=forcedVal 的那一个
    function findCombo(forcedId, forcedVal) {
      var keys = Object.keys(files);
      for (var i = 0; i < keys.length; i++) {
        var p = keys[i].split('|');
        var c = { mc: p[0], mv: p[1], ld: p[2] };
        if (c[forcedId] === forcedVal) return c;
      }
      return null;
    }

    // 重建某个下拉的选项（全部选项，选择后其它下拉会自动调整为有效组合）
    function render(id) {
      var cs = document.getElementById('cs-' + id);
      var list = cs.querySelector('.cs-list');
      list.innerHTML = '';
      allOpts[id].forEach(function(v) {
        var o = document.createElement('div');
        o.className = 'cs-opt'; o.textContent = v; o.setAttribute('data-v', v);
        o.addEventListener('click', function(ev) {
          ev.stopPropagation(); cs.classList.remove('open'); refresh(id, v);
        });
        list.appendChild(o);
      });
    }

    // 点击展开/收起（同一时间只开一个）
    document.querySelectorAll('.cs').forEach(function(cs) {
      cs.querySelector('.cs-head').addEventListener('click', function(ev) {
        ev.stopPropagation();
        var isOpen = cs.classList.contains('open');
        document.querySelectorAll('.cs.open').forEach(function(x) { x.classList.remove('open'); });
        if (!isOpen) cs.classList.add('open');
      });
    });
    document.addEventListener('click', function() {
      document.querySelectorAll('.cs.open').forEach(function(x) { x.classList.remove('open'); });
    });

    function refresh(forcedId, forcedVal) {
      var combo;
      if (forcedId) {
        combo = findCombo(forcedId, forcedVal) || { mc: getVal('mc'), mv: getVal('mv'), ld: getVal('ld') };
      } else {
        combo = findCombo('mc', allOpts.mc[0]) || { mc: allOpts.mc[0], mv: allOpts.mv[0], ld: allOpts.ld[0] };
      }
      setVal('mc', combo.mc); setVal('mv', combo.mv); setVal('ld', combo.ld);
      render('mc'); render('mv'); render('ld');
      var key = combo.mc + '|' + combo.mv + '|' + combo.ld;
      var href = files[key] || '#';
      var btn = document.getElementById('dlBtn');
      if (href === '#') {
        btn.href = '#'; btn.classList.add('disabled'); btn.textContent = '此组合暂无可下载文件';
      } else {
        btn.href = href; btn.classList.remove('disabled'); btn.textContent = '下载';
        btn.setAttribute('download', href.split('/').pop());
      }
    }
    refresh();
  </script>
</body>
</html>
