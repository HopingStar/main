<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<title>Welcome to HopingStar's Website</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --accent: #7c5cff;
    --accent2: #00d4ff;
    --text: #f0f0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text);
    overflow: hidden;
    position: relative;
  }
  /* 漂浮光斑 */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    animation: float 18s ease-in-out infinite alternate;
  }
  .b1 { width: 420px; height: 420px; background: var(--accent); top: -80px; left: -80px; }
  .b2 { width: 360px; height: 360px; background: var(--accent2); bottom: -60px; right: -40px; animation-delay: -6s; }
  .b3 { width: 300px; height: 300px; background: #ff6ec7; top: 50%; left: 60%; animation-delay: -11s; opacity: .3; }
  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, -30px) scale(1.15); }
  }
  .hero {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .badge {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #cdd6ff;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(8px);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4.2rem);
    font-weight: 800;
    letter-spacing: .5px;
    line-height: 1.15;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #fff, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    color: #b9c2ff;
    margin-bottom: 44px;
    letter-spacing: .5px;
  }
  .btn {
    position: relative;
    display: inline-block;
    padding: 16px 46px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 30px rgba(124, 92, 255, .45);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    animation: btnIn .8s cubic-bezier(.22,1,.36,1) 1s both;
  }
  /* 按钮光晕（伪元素，不影响按钮自身 transform/hover） */
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    filter: blur(16px);
    z-index: -1;
    opacity: .35;
    animation: glowPulse 2.6s ease-in-out 1.9s infinite;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,212,255,.5); filter: brightness(1.08); }
  .btn:hover::after { opacity: .7; }
  .btn:active { transform: translateY(0); }
  .hint { margin-top: 26px; font-size: 13px; color: #8a93c8; }

  /* ===== 进入动画 ===== */
  /* 标题：逐字淡入 + 由小变大 */
  .char {
    display: inline-block;
    opacity: 0;
    transform: scale(.4);
    animation: charIn .55s cubic-bezier(.22,1,.36,1) forwards, shine 3.2s linear 2.8s infinite;
    background: linear-gradient(90deg, #fff, var(--accent2), #fff, var(--accent2));
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  @keyframes charIn { from { opacity:0; transform:scale(.4); } to { opacity:1; transform:scale(1); } }
  /* 标题流光：渐变背景循环流动 */
  @keyframes shine {
    0% { background-position: 0% 0; }
    100% { background-position: -200% 0; }
  }

  /* 徽章：从上方掉落淡入 */
  .badge { animation: dropIn .7s cubic-bezier(.22,1,.36,1) .35s both; }
  @keyframes dropIn { from { opacity:0; transform:translateY(-26px); } to { opacity:1; transform:translateY(0); } }

  /* 副标题：从下方升起淡入 */
  .sub { animation: riseIn .8s cubic-bezier(.22,1,.36,1) .7s both; }
  @keyframes riseIn { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }

  /* 按钮：淡入放大（btnIn 在 .btn 基础块，播放后 JS 移除避免 hover 重播） */
  @keyframes btnIn { from { opacity:0; transform:scale(.7); } to { opacity:1; transform:scale(1); } }
  /* 光晕脉动（作用于 .btn::after 的 opacity） */
  @keyframes glowPulse {
    0%,100% { opacity: .3; }
    50% { opacity: .7; }
  }

  /* 提示：淡入后轻柔闪烁 */
  .hint { animation: hintIn .8s ease 1.2s both, hintBlink 3.2s ease-in-out 2.4s infinite; }
  @keyframes hintIn { from { opacity:0; } to { opacity:1; } }
  @keyframes hintBlink { 0%,100%{opacity:.65;} 50%{opacity:1;} }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="hero">
    <div class="badge">✨ Personal Website</div>
    <h1>Welcome to HopingStar's Website</h1>
    <p class="sub">Minecraft 模组开发者 · 欢迎光临</p>
    <a class="btn" href="home/">🚀 进入网站</a>
    <p class="hint">点击按钮进入首页</p>
  </div>
  <script>
    (function(){
      var h1 = document.querySelector('.hero h1');
      if (h1) {
        var text = h1.textContent;
        h1.textContent = '';
        for (var i = 0; i < text.length; i++) {
          var ch = text[i];
          var s = document.createElement('span');
          s.className = 'char';
          s.textContent = ch === ' ' ? '\u00a0' : ch;
          s.style.animationDelay = (0.15 + i * 0.045).toFixed(3) + 's';
          h1.appendChild(s);
        }
      }
      // 按钮进入动画播完后移除 animation，避免 hover 时动画重播/消失
      var btn = document.querySelector('.hero .btn');
      if (btn) {
        setTimeout(function(){ btn.style.animation = 'none'; }, 1900);
      }
    })();
  </script>
</body>
</html>
