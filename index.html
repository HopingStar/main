<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<title>Welcome to HopingStar's Website</title>
<style>
  :root {
    --bg1: #0f0c29;
    --bg2: #302b63;
    --bg3: #24243e;
    --accent: #7c5cff;
    --accent2: #00d4ff;
    --text: #f0f0ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text);
    overflow: hidden;
    position: relative;
  }
  /* 漂浮光斑 */
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .45;
    animation: float 18s ease-in-out infinite alternate;
  }
  .b1 { width: 420px; height: 420px; background: var(--accent); top: -80px; left: -80px; }
  .b2 { width: 360px; height: 360px; background: var(--accent2); bottom: -60px; right: -40px; animation-delay: -6s; }
  .b3 { width: 300px; height: 300px; background: #ff6ec7; top: 50%; left: 60%; animation-delay: -11s; opacity: .3; }
  @keyframes float {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, -30px) scale(1.15); }
  }
  .hero {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 20px;
  }
  .badge {
    display: inline-block;
    padding: 6px 18px;
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 999px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #cdd6ff;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(8px);
    margin-bottom: 24px;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 4.2rem);
    font-weight: 800;
    letter-spacing: .5px;
    line-height: 1.15;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #fff, var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    color: #b9c2ff;
    margin-bottom: 44px;
    letter-spacing: .5px;
  }
  .btn {
    position: relative;
    display: inline-block;
    padding: 16px 46px;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 30px rgba(124, 92, 255, .45);
    transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,212,255,.5); filter: brightness(1.08); }
  .btn:active { transform: translateY(0); }
  .hint { margin-top: 26px; font-size: 13px; color: #8a93c8; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="hero">
    <div class="badge">✨ Personal Website</div>
    <h1>Welcome to HopingStar's Website</h1>
    <p class="sub">Minecraft 模组开发者 · 欢迎光临</p>
    <a class="btn" href="home/">🚀 进入网站</a>
    <p class="hint">点击按钮进入首页</p>
  </div>
</body>
</html>
