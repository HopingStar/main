<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 · HopingStar</title>
<style>
  :root {
    --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --accent: #7c5cff; --accent2: #00d4ff;
    --card: rgba(255,255,255,.06);
    --border: rgba(255,255,255,.12);
    --text: #f0f0ff; --muted: #aab2e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    color: var(--text);
    padding: 20px;
  }
  .nav { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 40px; }
  .nav a {
    color: var(--text); text-decoration: none;
    padding: 9px 22px; border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(8px); font-size: 14px; transition: .2s;
  }
  .nav a:hover, .nav a.active { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px;
    max-width: 560px;
    margin: 0 auto;
    backdrop-filter: blur(10px);
  }
  h1 { text-align: center; font-size: 26px; margin-bottom: 22px; }
  .section { background: rgba(0,0,0,.25); border-radius: 12px; padding: 16px 20px; margin: 14px 0; }
  .section h2 { font-size: 16px; color: #ffd740; margin-bottom: 8px; }
  .section p, .section ul { font-size: 14px; color: var(--muted); line-height: 1.8; }
  .section ul { padding-left: 20px; }
  .avatar {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; margin: 0 auto 16px; box-shadow: 0 8px 30px rgba(124,92,255,.4);
  }
  .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #8a93c8; }
</style>
</head>
<body>
  <div class="nav">
    <a href="index.html">🏠 首页</a>
    <a href="mods.html">🧩 模组展示</a>
    <a href="download.html">📦 下载</a>
    <a href="about.html" class="active">ℹ️ 关于</a>
  </div>

  <div class="card">
    <div class="avatar">⭐</div>
    <h1>关于 HopingStar</h1>

    <div class="section">
      <h2>作者</h2>
      <p><b>HopingStar</b> · Minecraft 模组爱好者 / 整合包维护者</p>
    </div>

    <div class="section">
      <h2>这个补丁做什么</h2>
      <p>维护整合包时发现 <b>l2weaponry</b> 与 <b>traveloptics</b> 存在不兼容问题（崩溃）。</p>
      <p>本补丁用运行时 Mixin 技术自动修复这两处冲突，让它们能共存，无需手动改模组文件。</p>
    </div>

    <div class="section">
      <h2>技术支持 / 反馈</h2>
      <ul>
        <li>遇到问题可在本仓库提交 Issue</li>
        <li>反馈时请附上 <code>latest.log</code> 日志</li>
      </ul>
    </div>

    <div class="footer">© <span id="yr"></span> HopingStar · MIT License</div>
  </div>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
